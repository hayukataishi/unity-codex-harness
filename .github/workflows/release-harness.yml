name: Release Harness

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-harness-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_DIR: Artifacts/Releases/${{ github.ref_name }}

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Validate release tag and repository
        run: |
          python3 scripts/build_release.py --check --tag "${GITHUB_REF_NAME}"
          python3 scripts/validate_repository.py

      - name: Run Python regression tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Compile Python scripts
        run: >-
          python3 -m py_compile
          scripts/*.py
          .agents/skills/validate-unity-change/scripts/*.py

      - name: Build deterministic release artifact
        run: >-
          python3 scripts/build_release.py
          --tag "${GITHUB_REF_NAME}"
          --output "${RELEASE_DIR}"

      - name: Verify release checksums
        working-directory: ${{ env.RELEASE_DIR }}
        run: sha256sum --check SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES_FILE="$(
            python3 -c \
              'import json; print(json.load(open("harness.release.json"))["releaseNotes"])'
          )"
          gh release create "${GITHUB_REF_NAME}" \
            "${RELEASE_DIR}/unity-codex-harness-"*.zip \
            "${RELEASE_DIR}/release-manifest.json" \
            "${RELEASE_DIR}/SHA256SUMS" \
            --verify-tag \
            --title "Unity Codex Harness ${GITHUB_REF_NAME}" \
            --notes-file "${NOTES_FILE}"
